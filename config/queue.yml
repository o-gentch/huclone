default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "content_processing"
      threads: 10
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1
    - queues: "personality_map"
      threads: 5
      processes: 1
      polling_interval: 0.5
    - queues: "media"
      threads: 2
      processes: 1 # ffmpeg: один процесс, чтобы не съесть CPU и диск
      polling_interval: 1
    - queues: "transcription"
      threads: 3
      processes: 1
      polling_interval: 1
    - queues: "chat"
      threads: 5
      processes: 1
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
